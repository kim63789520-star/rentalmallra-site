<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>사이트 모음 | 렌탈몰라</title>
<meta name="description" content="가전결합 멤버십 · 생활가전 렌탈 · 보장 점검 상담 사이트 모음">
<meta property="og:title" content="사이트 모음">
<meta property="og:description" content="가전결합 멤버십 · 생활가전 렌탈 · 보장 점검 상담">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
<style>
/* 쇼룸 톤 — 본 사이트와 같은 흰 바탕 + 네이비 한 색 */
:root{
  --paper:#ffffff; --mist:#f2f4f6; --line:#dde1e6;
  --ink:#1a2332; --muted:#5b6573; --navy:#193c49; --navy-deep:#122d37;
  --serif:"MaruBuriBold","MaruBuri","Noto Serif KR",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:40px 16px 48px}
.head{text-align:center;margin-bottom:28px}
.head h1{font-family:var(--serif);font-size:26px;margin:0 0 8px;color:var(--navy)}
.head p{margin:0;color:var(--muted);font-size:15px}
.group{margin:0 0 22px}
.group h2{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 10px 4px}
.card{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:18px 18px;margin-bottom:10px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--navy)}
.card:active{transform:scale(.99)}
.card .txt{flex:1;min-width:0}
.card strong{display:block;font-size:17px;color:var(--ink)}
.card span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.card .arr{flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1>사이트 모음</h1>
    <p>필요하신 곳을 눌러 확인해 주세요</p>
  </div>

  <section class="group">
    <h2>가전결합 멤버십</h2>
    <a class="card" href="/">
      <div class="txt"><strong>상조몰라</strong><span>보람상조피플 가전결합</span></div>
      <div class="arr" aria-hidden="true">›</div>
    </a>
    <a class="card" href="/the/">
      <div class="txt"><strong>더리본</strong><span>더리본상조 가전결합</span></div>
      <div class="arr" aria-hidden="true">›</div>
    </a>
    <a class="card" href="/sono/">
      <div class="txt"><strong>소노</strong><span>소노아임레디 스마트케어 가전결합</span></div>
      <div class="arr" aria-hidden="true">›</div>
    </a>
  </section>

  <section class="group">
    <h2>생활가전 렌탈</h2>
    <a class="card" href="https://rentalmass.shop/">
      <div class="txt"><strong>렌탈매스</strong><span>정수기 · 공기청정기 · 안마의자 렌탈</span></div>
      <div class="arr" aria-hidden="true">›</div>
    </a>
  </section>

  <section class="group">
    <h2>보험</h2>
    <a class="card" href="/bohum/">
      <div class="txt"><strong>같은 보장, 다른 조건</strong><span>보장 점검 상담</span></div>
      <div class="arr" aria-hidden="true">›</div>
    </a>
  </section>

  <p class="foot">rentalmallra.co.kr</p>
</main>
</body>
</html>
