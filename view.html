<link rel="preconnect" href="https://cdn.jsdelivr.net">

<style>

:root{
  --navy:#14243f; --navy2:#1d3358; --sand:#b98a4b; --sand-soft:#e7d8bf;
  --bg:#f6f3ee; --card:#ffffff; --ink:#1c2530; --muted:#6d7686; --line:#e7e3db;
  --ok:#1f7a4d; --shadow:0 6px 24px rgba(20,36,63,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);padding-top:62px;padding-bottom:84px;word-break:keep-all;overflow-wrap:break-word;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:13px 26px;font-weight:700;
  font-size:15px;border:0;cursor:pointer;transition:.18s;white-space:nowrap}
.btn-primary{background:var(--sand);color:#fff}
.btn-primary:hover{background:#a6773a}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{background:var(--navy2)}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(20,36,63,.97);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{display:flex;align-items:baseline;gap:9px;color:#fff}
.logo b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.logo span{font-size:12px;color:var(--sand-soft);font-weight:600}
.nav-links{display:flex;gap:26px;color:#dfe4ee;font-size:15px;font-weight:600}
.nav-links a:hover{color:var(--sand-soft)}
.nav-cta .btn{padding:9px 18px;font-size:14px}
@media(max-width:820px){.nav-links{display:none}}
section{padding:64px 0}
.sec-head{text-align:center;max-width:680px;margin:0 auto 44px}
.sec-head .tag{color:var(--sand);font-weight:800;font-size:14px;letter-spacing:.04em}
.sec-head h2{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.02em;margin:8px 0 12px;color:var(--navy)}
.sec-head p{color:var(--muted);font-size:16px;margin:0}
.refund{background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:44px 40px;margin-top:8px}
.refund h3{font-size:24px;font-weight:800;margin:0 0 6px}
.refund .rlead{color:#d6dcea;margin:0 0 26px;font-size:16px}
.conds{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cond-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:20px}
.cond-card .n{color:var(--sand-soft);font-weight:800;font-size:13px;margin-bottom:8px}
.cond-card b{display:block;font-size:16px;margin-bottom:4px}
.cond-card span{font-size:13.5px;color:#aeb8ca}
.refund .allthree{margin-top:20px;font-size:14px;color:#d6dcea;text-align:center}
.refund .allthree em{color:var(--sand-soft);font-style:normal;font-weight:700}
@media(max-width:820px){.conds{grid-template-columns:1fr}.refund{padding:32px 24px}}
.notice{background:#fff}
.notice-inner{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:30px 30px}
.notice h3{margin:0 0 14px;font-size:17px;color:var(--navy);font-weight:800}
.notice ul{margin:0;padding-left:20px;color:var(--muted);font-size:13.5px;line-height:1.9}
.notice ul li b{color:var(--ink)}
.ctaband{background:linear-gradient(120deg,var(--sand),#a6773a);color:#fff;text-align:center;padding:56px 0}
.ctaband h2{font-size:clamp(24px,3.4vw,32px);font-weight:800;margin:0 0 10px}
.ctaband p{margin:0 0 26px;font-size:16px;color:#fff7ec}
.ctaband .btn-dark{background:var(--navy)}
.ctaband .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
footer{background:var(--navy);color:#aeb8ca;padding:40px 0 48px;font-size:13px}
footer .logo b{color:#fff;font-size:18px}
footer .biz{margin-top:16px;line-height:1.9}
footer .biz .k{color:#7f8aa0}
footer .disc{margin-top:18px;color:#7f8aa0;font-size:12px;line-height:1.7;border-top:1px solid rgba(255,255,255,.1);padding-top:16px}
.fill{color:#d9b483;font-weight:700}
.foot-top{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
.foot-biz .fb-name{color:#fff;font-size:18px;font-weight:800}
.foot-biz .fb-name span{font-size:13px;font-weight:600;color:#aeb8ca;margin-left:6px}
.foot-biz .fb-line{margin-top:8px;line-height:1.8}
.foot-biz .fb-copy{margin-top:14px;color:#7f8aa0}
.foot-cs{text-align:right;min-width:210px}
.foot-cs .cs-title{color:var(--sand-soft);font-weight:800;letter-spacing:.08em;font-size:13px}
.foot-cs .cs-num{color:#fff;font-size:24px;font-weight:800;letter-spacing:-.01em;margin:4px 0 8px}
.foot-cs .cs-sub{color:#aeb8ca;font-size:12.5px}
@media(max-width:640px){.foot-cs{text-align:left}}
/* consult form */
.consult{background:#fff}
.consult-card{display:grid;grid-template-columns:1.05fr 1fr;gap:0;background:var(--navy);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.consult-card .cs-left{padding:44px 40px;color:#fff;background:linear-gradient(155deg,var(--navy),var(--navy2))}
.consult-card .cs-tag{color:var(--sand-soft);font-weight:800;font-size:13px;letter-spacing:.06em}
.consult-card .cs-left h2{color:#fff;font-size:28px;font-weight:800;margin:8px 0 12px}
.consult-card .cs-left p{color:#d6dcea;font-size:15px;margin:0 0 24px}
.cs-alt{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
/* 구 .cs-alt a 규칙 제거 — 전화(초록)·카카오(노랑) 버튼은 아래 .alt-btn 규칙이 담당 */
.cs-hours{font-size:12.5px;color:#8f9ab0}
.cs-form{padding:44px 40px;display:flex;flex-direction:column;gap:16px;background:#fff}
.cs-form label{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:700;color:var(--navy)}
.cs-form input{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;font-family:inherit;font-weight:500;color:var(--ink)}
.cs-form input:focus{outline:none;border-color:var(--sand);box-shadow:0 0 0 3px rgba(185,138,75,.15)}
.cs-form button{margin-top:6px;background:var(--sand);color:#fff;border:0;border-radius:12px;padding:16px;font-size:16px;
  font-weight:800;cursor:pointer;transition:.18s;font-family:inherit}
.cs-form button:hover{background:#a6773a}
.cs-form button:disabled{opacity:.6;cursor:default}
.cs-msg{margin:2px 0 0;font-size:14px;font-weight:700;min-height:20px}
.cs-msg.ok{color:var(--ok)}
.cs-msg.err{color:#c0392b}
.cs-privacy{margin:0;font-size:11.5px;color:var(--muted);line-height:1.6}
@media(max-width:760px){.consult-card{grid-template-columns:1fr}.consult-card .cs-left,.cs-form{padding:30px 24px}}
section{scroll-margin-top:72px}
/* 전화(초록) · 카카오(노랑) 상담 버튼 */
.cs-alt{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.alt-btn{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px 18px;transition:.18s;border:0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.alt-btn svg{width:30px;height:30px;flex:0 0 30px}
.alt-btn span{display:flex;flex-direction:column;line-height:1.2}
.alt-btn span b{font-size:17px;font-weight:800}
.alt-btn span i{font-style:normal;font-size:13px;opacity:.92;margin-top:3px}
.alt-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.24)}
.alt-call{background:#19b25b;color:#fff}
.alt-call:hover{background:#149a4d}
.alt-kakao{background:#FEE500;color:#3C1E1E}
.alt-kakao:hover{background:#f5dc00}
/* 상담 신청하기 버튼 강조 */
.cs-form button{font-size:18px;padding:18px;background:linear-gradient(135deg,#d3a45c,#b98a4b);box-shadow:0 8px 22px rgba(185,138,75,.45);animation:csPulse 2.2s ease-in-out infinite}
.cs-form button:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(185,138,75,.55);animation:none}
@keyframes csPulse{0%,100%{box-shadow:0 8px 22px rgba(185,138,75,.45)}50%{box-shadow:0 8px 32px rgba(185,138,75,.8)}}
/* 왼쪽 플로팅 빠른상담 버튼 */
.floatbtns{position:fixed;left:16px;bottom:104px;z-index:80;display:flex;flex-direction:column;gap:10px}
.fb{display:flex;flex-direction:column;align-items:center;justify-content:center;width:66px;height:66px;border-radius:50%;
  box-shadow:0 8px 22px rgba(0,0,0,.25);transition:.18s;font-size:10.5px;font-weight:800;line-height:1.15;text-align:center}
.fb svg{width:24px;height:24px;margin-bottom:2px}
.fb:hover{transform:scale(1.08)}
.fb-kakao{background:#FEE500;color:#3C1E1E}
.fb-call{background:#19b25b;color:#fff}
/* 하단 고정 상담바 */
.leadbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--navy);border-top:2px solid var(--sand);box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.lb-inner{display:flex;align-items:center;gap:16px;padding:12px 20px}
.lb-title{display:flex;align-items:center;gap:10px;color:#fff;white-space:nowrap}
.lb-title svg{width:26px;height:26px;color:var(--sand-soft)}
.lb-title span{display:flex;flex-direction:column;line-height:1.15}
.lb-title b{font-size:16px;font-weight:800}
.lb-title i{font-style:normal;font-size:11.5px;color:#aeb8ca;margin-top:2px}
.lb-form{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.lb-form input{flex:1;min-width:0;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:12px 14px;font-size:16px;font-family:inherit}
.lb-form input::placeholder{color:#8f9ab0}
.lb-form input:focus{outline:none;border-color:var(--sand);background:rgba(255,255,255,.14)}
.lb-form button{flex:0 0 auto;background:linear-gradient(135deg,#d3a45c,#b98a4b);color:#fff;border:0;border-radius:10px;padding:13px 24px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 6px 16px rgba(185,138,75,.45);transition:.15s}
.lb-form button:hover{transform:translateY(-1px);filter:brightness(1.06)}
.lb-form button:disabled{opacity:.6}
@media(max-width:820px){.lb-title span i{display:none}.lb-title b{font-size:14px}}
@media(max-width:640px){
  .lb-inner{gap:8px;padding:8px 10px}
  .lb-title{display:none}
  .lb-long{display:none}
  .lb-form{gap:6px}
  .lb-form input{padding:11px 10px;border-radius:9px}
  .lb-form button{padding:11px 14px;font-size:14px;border-radius:9px}
  .floatbtns{bottom:82px;left:auto;right:10px;gap:8px}
  .fb{width:54px;height:54px;font-size:9.5px}
  .fb svg{width:20px;height:20px}
  body{padding-bottom:76px}
}
/* 접수 결과 토스트 */
.tg-toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-12px);z-index:200;background:var(--navy);color:#fff;
  padding:13px 20px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.3s;max-width:92vw;text-align:center}
.tg-toast.show{opacity:1;transform:translate(-50%,0)}
.tg-toast.ok{background:var(--ok)}
.tg-toast.err{background:#c0392b}


.crumb{padding:18px 20px 0;font-size:13px;color:var(--muted)}
.crumb a:hover{color:var(--sand)}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:26px 0 10px;align-items:start}
@media(max-width:860px){.pv{grid-template-columns:1fr;gap:24px}}
.gal .main{background:#fff;border:1px solid var(--line);border-radius:18px;aspect-ratio:1/1;display:flex;
  align-items:center;justify-content:center;padding:26px;overflow:hidden}
.gal .main img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.gal .thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.gal .thumbs img{width:66px;height:66px;object-fit:contain;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:6px;cursor:pointer}
.gal .thumbs img.on{border-color:var(--sand)}
.pinfo .gj{display:inline-block;font-size:12px;font-weight:700;color:var(--sand);background:rgba(185,138,75,.12);border-radius:7px;padding:5px 11px;margin-bottom:12px}
.pinfo .brand{color:var(--muted);font-weight:700;font-size:14px}
.pinfo h1{font-size:clamp(21px,3vw,27px);font-weight:800;color:var(--navy);letter-spacing:-.02em;margin:4px 0 6px;line-height:1.35}
.pinfo .modelno{font-size:13px;color:#9aa2ae;margin-bottom:20px;word-break:break-all;overflow-wrap:anywhere}
.pricebox{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.pricebox .label{font-size:13px;color:var(--muted);margin-bottom:2px}
.pricebox .big{font-size:32px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.pricebox .big small{font-size:16px;font-weight:600;color:var(--muted)}
.pricebox .rowline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:9px 0;border-top:1px dashed var(--line);margin-top:12px}
.pricebox .rowline b{color:var(--ink)}
.summary{list-style:none;padding:0;margin:0 0 20px;font-size:14.5px}
.summary li{padding:8px 0 8px 26px;position:relative;border-top:1px solid var(--line)}
.summary li:before{content:"\2713";position:absolute;left:0;top:8px;color:var(--sand);font-weight:800}
.pbtns{display:flex;gap:10px;flex-wrap:wrap}
.pbtns .btn-line{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
.detail-imgs{background:#fff}
.detail-imgs .di-head{text-align:center;margin-bottom:24px}
.detail-imgs .di-head h2{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 6px}
.detail-imgs .di-head p{color:var(--muted);font-size:14px;margin:0}
.detail-imgs .stack{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:0}
.detail-imgs .stack img{width:100%;border-radius:0}
.detail-imgs .stack img:first-child{border-radius:14px 14px 0 0}
.detail-imgs .stack img:last-child{border-radius:0 0 14px 14px}
.notfound{max-width:560px;margin:80px auto;text-align:center}
.notfound h2{color:var(--navy)}

</style>
</head>

<script src="config.js"></script>
<script>
(function(){
  var forms=document.querySelectorAll("form.tg-consult");
  if(!forms.length) return;
  try{ if(window.__PRODUCT__){ document.querySelectorAll('input[name="product"]').forEach(function(el){el.value=window.__PRODUCT__;}); } }catch(e){}
  function toast(t,type){
    var el=document.createElement("div"); el.className="tg-toast "+(type||""); el.textContent=t;
    document.body.appendChild(el);
    setTimeout(function(){el.classList.add("show");},10);
    setTimeout(function(){el.classList.remove("show"); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },350);},3800);
  }
  function localMsg(form,t,type){ var m=form.querySelector(".cs-msg"); if(m){ m.textContent=t; m.className="cs-msg"+(type?(" "+type):""); } }
  forms.forEach(function(form){
    form.addEventListener("submit",function(e){
      e.preventDefault();
      var name=(form.elements["name"].value||"").trim();
      var phoneRaw=(form.elements["phone"].value||"").trim();
      var digits=phoneRaw.replace(/[^0-9]/g,"");
      if(name.length<2){ toast("이름을 입력해 주세요.","err"); localMsg(form,"이름을 정확히 입력해 주세요.","err"); form.elements["name"].focus(); return; }
      if(digits.length<10||digits.length>11){ toast("핸드폰번호를 정확히 입력해 주세요.","err"); localMsg(form,"핸드폰번호를 정확히 입력해 주세요.","err"); form.elements["phone"].focus(); return; }
      var cfg=(window.TG||{});
      if(!cfg.token||!cfg.chat_id||String(cfg.token).indexOf("BOT_TOKEN")>=0||String(cfg.chat_id).indexOf("CHAT_ID")>=0){
        toast("접수 설정이 완료되지 않았습니다. 전화 010-8175-7015","err"); return;
      }
      var product=""; try{ product=(form.elements["product"].value||"").trim(); }catch(e){}
      var text="\u{1F514} [보람상조피플] 상담 신청\n\n이름: "+name+"\n연락처: "+phoneRaw
        +(product?("\n관심상품: "+product):"")
        +"\n페이지: "+location.href
        +"\n시각: "+new Date().toLocaleString("ko-KR");
      var btn=form.querySelector("button"); if(btn) btn.disabled=true;
      localMsg(form,"접수 중입니다...","");
      fetch("https://api.telegram.org/bot"+cfg.token+"/sendMessage",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({chat_id:cfg.chat_id, text:text})
      }).then(function(r){return r.json();}).then(function(d){
        if(d && d.ok){ form.reset(); toast("상담 신청이 접수되었습니다. 곧 연락드리겠습니다.","ok"); localMsg(form,"상담 신청이 접수되었습니다. 곧 연락드리겠습니다.","ok"); }
        else { toast("전송에 실패했습니다. 전화 010-8175-7015 로 연락 주세요.","err"); localMsg(form,"전송에 실패했습니다. 전화 010-8175-7015 로 연락 주세요.","err"); }
        if(btn) btn.disabled=false;
      }).catch(function(){ toast("전송에 실패했습니다. 전화 010-8175-7015 로 연락 주세요.","err"); localMsg(form,"전송에 실패했습니다. 전화 010-8175-7015 로 연락 주세요.","err"); if(btn) btn.disabled=false; });
    });
  });
})();
</script>
